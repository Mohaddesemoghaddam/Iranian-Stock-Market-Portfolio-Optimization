name: Research repository checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y glpk-utils
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - run: python scripts/pre_publish_check.py
      - run: python -m pytest -q
